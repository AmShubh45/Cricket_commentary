services:
  - type: web
    name: cricket-commentary
    runtime: python
    plan: free
    buildCommand: pip install -e "." && pip install mutagen
    startCommand: python scripts/run_live_stream_server.py
    envVars:
      - key: PYTHONPATH
        value: src:config:.
      - key: PORT
        value: 8000
      - key: TTS_PROVIDER
        value: edge_tts
      - key: TTS_VOICE_ID
        value: hi-IN-MadhurNeural
      - key: LLM_PROVIDER
        value: free
      - key: DATA_FEED_PROVIDER
        value: cricbuzz
