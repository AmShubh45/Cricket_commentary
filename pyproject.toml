[project]
name = "cricket-commentary"
version = "0.1.0"
description = "Automated Hindi cricket commentary for YouTube live streaming"
requires-python = ">=3.11"
authors = [{ name = "Shubh" }]
readme = "README.md"

dependencies = [
    # --- Core Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # --- Async Database ---
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.14.0",

    # --- Task Queue ---
    "celery[redis]>=5.4.0",

    # --- Redis ---
    "redis[hiredis]>=5.2.0",

    # --- HTTP Client ---
    "httpx>=0.27.0",

    # --- TTS Providers ---
    "edge-tts>=7.0.0",                  # Free Microsoft TTS (budget default)
    # "elevenlabs>=1.10.0",             # Uncomment when upgrading

    # --- LLM Providers ---
    "boto3>=1.35.0",                    # AWS Bedrock
    # "ollama>=0.4.0",                  # Uncomment for local LLM fallback

    # --- Observability ---
    "langfuse>=2.50.0",
    "structlog>=24.4.0",

    # --- Graphics / Rendering ---
    "playwright>=1.48.0",
    "Jinja2>=3.1.4",

    # --- Audio / Video ---
    # ffmpeg is a system dependency, not a pip package
    "pydub>=0.25.1",                    # Audio manipulation helper

    # --- Utilities ---
    "orjson>=3.10.0",                   # Fast JSON serialization
    "tenacity>=9.0.0",                  # Retry logic for external APIs
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

elevenlabs = [
    "elevenlabs>=1.10.0",
]

ollama = [
    "ollama>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricket"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit (security)
    "A",    # builtins shadowing
    "C4",   # comprehensions
    "DTZ",  # datetime timezone
    "T20",  # print statements
    "RET",  # return values
    "SIM",  # simplify
    "ARG",  # unused arguments
    "ERA",  # commented-out code
]
ignore = ["S101", "ARG002"]  # Allow assert in tests, allow unused args in abstract methods

[tool.ruff.lint.isort]
known-first-party = ["cricket"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
